    <style>
        #map-root { position: fixed; inset: 0; z-index: 0; display: none; }
        #map-root.visible { display: block; }
        .leaflet-pane, .leaflet-control { z-index: 1 !important; }
        .div-pin-icon { background: none; border: none; }
        .div-car-icon { background: none; border: none; }
        :root { --uber-black: #000000; --uber-gray: #f6f6f6; --text-main: #222222; --text-light: #757575; --border: #efefef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--uber-gray); color: var(--text-main); overflow-x: hidden; }

        .map-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #e8eaed; z-index: 0; overflow: hidden; }
        .map-grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff 2px, transparent 2px), linear-gradient(90deg, #ffffff 2px, transparent 2px); background-size: 80px 80px; }
        .map-road-main { position: absolute; background: #ffffff; box-shadow: 0 0 10px rgba(0,0,0,0.05); z-index: 1; }
        .map-block { position: absolute; background: #f1f3f4; border-radius: 4px; z-index: 0; }
        .map-park { position: absolute; background: #d8e6c4; border-radius: 8px; z-index: 0; }
        .map-water { position: absolute; background: #b3d4f1; border-radius: 8px; z-index: 0; }

        .map-marker { position: absolute; transform: translate(-50%, -50%); transition: all 1s linear; z-index: 10; }
        .marker-pin svg { display:block; }
        .car-icon { width: 36px; height: 36px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 2px solid #fff; }
        .pulse-ring { position: absolute; width: 40px; height: 40px; background: rgba(0,0,0,0.2); border-radius: 50%; transform: translate(-50%, -50%); animation: pulseAnim 2s infinite; z-index: 5; }
        @keyframes pulseAnim { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }

        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); z-index: 20; max-width: 500px; left: 50%; transform: translateX(-50%); max-height: 80vh; overflow-y: auto; }
        .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto; }
        .uber-btn { background: var(--uber-black); color: #fff; padding: 16px; border-radius: 8px; width: 100%; font-weight: 500; font-size: 16px; border: none; cursor: pointer; transition: 0.2s; }
        .uber-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .uber-btn:hover:not(:disabled) { background: #333; }
        .uber-btn-outline { background: #fff; color:#000; border: 1px solid #000; }
        .input-group { display: flex; align-items: center; background: var(--uber-gray); padding: 14px 16px; border-radius: 8px; margin-bottom: 12px; }
        .input-group select, .input-group input { background: transparent; border: none; outline: none; width: 100%; font-size: 15px; color: var(--text-main); }
        .plain-input { width:100%;padding:16px;border:1px solid #eee;border-radius:8px;margin-bottom:12px;font-size:16px; }

        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        table { width: 100%; border-collapse: collapse; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll table { min-width: 640px; }
        th { text-align: left; padding: 16px; color: var(--text-light); border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
        tr:hover { background: #fafafa; }
        .err { color:#c0392b; font-size:13px; margin-bottom:12px; }
        .nav-tab { padding: 6px 16px; font-size: 14px; border: none; background: transparent; cursor: pointer; border-radius: 16px; color: #757575; }
        .tab-active { background: #000; color: #fff; }
        .gender-pill { flex:1; padding:12px; text-align:center; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; border:2px solid transparent; }
        .sos-btn { background:#c0392b; color:#fff; padding:14px; border-radius:8px; width:100%; font-weight:700; font-size:15px; border:none; cursor:pointer; letter-spacing:0.3px; }
        .sos-btn:hover { background:#a52d20; }
        .link-btn { background:none; border:none; color:#757575; text-decoration:underline; cursor:pointer; font-size:13px; }
        @media (max-width: 420px) {
            .brand-text { display: none; }
            .nav-tab { padding: 6px 10px !important; font-size: 13px !important; }
        }
    </style>
</head>
<body>
    <div id="map-root"></div>
    <div id="app"></div>

    <script>
    // ================== CONFIG ==================
    const SUPABASE_URL = "https://kwnvnmjfraymmdpeccmr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3bnZubWpmcmF5bW1kcGVjY21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzQ0ODUsImV4cCI6MjEwMDgxMDQ4NX0.ftnpnjeZ0-fB8HetW9XM2l0MeotkYq-QZwcHffQ34Do";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOCATIONIQ_KEY = "pk.9824ee6bf1f64d312429c30965b97e6f";

    // Real coordinates around Layyah, Punjab, Pakistan (used since no maps/geocoding API is connected yet)
    const PLACES = {
        "Layyah Bus Stand": { lat: 30.9642, lng: 70.9432 },
        "Chowk Azam": { lat: 30.9765, lng: 70.6641 },
        "Fatehpur": { lat: 30.9491, lng: 71.0298 },
        "Karor Lal Esan": { lat: 31.2225, lng: 70.9575 },
        "Choubara": { lat: 30.6484, lng: 70.8907 },
        "DHQ Hospital Layyah": { lat: 30.9601, lng: 70.9411 },
        "Government College Layyah": { lat: 30.9678, lng: 70.9455 },
        "Layyah Railway Station": { lat: 30.9598, lng: 70.9389 }
    };
    // ================== REAL MAP (Leaflet + LocationIQ) ==================
    // The map lives in #map-root, OUTSIDE the #app div that render() rewrites on every
    // state change. This means the Leaflet instance is created ONCE and only updated
    // in place afterwards (setView / marker.setLatLng) — never destroyed and rebuilt,
    // which keeps tile requests (and cost) down and avoids flicker on every re-render.
    let leafletMap = null;
    let mapMarkers = { pickup: null, dropoff: null, driver: null };

    function ensureMap() {
        const root = document.getElementById('map-root');
        root.classList.add('visible');
        if (leafletMap) return leafletMap;
        leafletMap = L.map('map-root', { zoomControl: false, attributionControl: true });
        L.tileLayer(`https://{s}-tiles.locationiq.com/v3/streets/r/{z}/{x}/{y}.png?key=${LOCATIONIQ_KEY}`, {
            attribution: '&copy; LocationIQ &copy; OpenStreetMap contributors',
            subdomains: 'abc',
            maxZoom: 19
        }).addTo(leafletMap);
        leafletMap.setView([30.9642, 70.9432], 13); // Layyah default center
        return leafletMap;
    }
    function hideMap() {
        const root = document.getElementById('map-root');
        if (root) root.classList.remove('visible');
    }
    function pinDivIcon(color, label) {
        return L.divIcon({
            className: 'div-pin-icon',
            html: `<div style="width:26px;height:26px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
            iconSize: [26, 26], iconAnchor: [13, 26]
        });
    }
    function carDivIcon(vehicleType) {
        return L.divIcon({
            className: 'div-car-icon',
            html: `<div style="width:34px;height:34px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.3);">${vIcon(vehicleType)}</div>`,
            iconSize: [34, 34], iconAnchor: [17, 17]
        });
    }
    // Updates markers in place for the active ride's tracking view.
    function syncTrackingMap(r) {
        const map = ensureMap();
        if (mapMarkers.rideId !== r.id) { mapMarkers.rideId = r.id; mapMarkers._fitted = false; }
        const pts = [];
        if (r.pickup_lat && r.pickup_lng) {
            const ll = [r.pickup_lat, r.pickup_lng];
            if (!mapMarkers.pickup) mapMarkers.pickup = L.marker(ll, { icon: pinDivIcon('#000') }).addTo(map);
            else mapMarkers.pickup.setLatLng(ll);
            pts.push(ll);
        }
        if (r.dropoff_lat && r.dropoff_lng) {
            const ll = [r.dropoff_lat, r.dropoff_lng];
            if (!mapMarkers.dropoff) mapMarkers.dropoff = L.marker(ll, { icon: pinDivIcon('#333') }).addTo(map);
            else mapMarkers.dropoff.setLatLng(ll);
            pts.push(ll);
        }
        if (r.status !== 'searching' && r.driver_lat && r.driver_lng) {
            const ll = [r.driver_lat, r.driver_lng];
            if (!mapMarkers.driver) mapMarkers.driver = L.marker(ll, { icon: carDivIcon(r.vehicle_type) }).addTo(map);
            else mapMarkers.driver.setLatLng(ll);
            pts.push(ll);
        } else if (mapMarkers.driver) {
            map.removeLayer(mapMarkers.driver);
            mapMarkers.driver = null;
        }
        if (pts.length && !mapMarkers._fitted) {
            map.fitBounds(pts, { padding: [60, 60], maxZoom: 16 });
            mapMarkers._fitted = true;
        } else if (pts.length === 1) {
            map.setView(pts[0], 15);
        }
    }
    function clearTrackingMap() {
        if (mapMarkers.pickup) { leafletMap && leafletMap.removeLayer(mapMarkers.pickup); mapMarkers.pickup = null; }
        if (mapMarkers.dropoff) { leafletMap && leafletMap.removeLayer(mapMarkers.dropoff); mapMarkers.dropoff = null; }
        if (mapMarkers.driver) { leafletMap && leafletMap.removeLayer(mapMarkers.driver); mapMarkers.driver = null; }
        mapMarkers.rideId = null; mapMarkers._fitted = false;
        hideMap();
    }

    const Icons = {
        car: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>',
        bike: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>',
        rickshaw: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14h-2V7H6v7H4V4H2v12h2v2h2v-2h12v2h2v-2h2v-2h-2zM8 14V9h8v5H8z"/></svg>',
        pin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
        user: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
        shield: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>',
        star: '<svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>'
    };
    function vIcon(v){ return v==='bike'?Icons.bike : v==='rickshaw'?Icons.rickshaw : Icons.car; }

    // ================== I18N (core flows; expand as needed) ==================
    const STR = {
        en: {
            ride:'Ride', drive:'Drive', admin:'Admin',
            rideTitle:'Ride with Go Drive', driveTitle:'Drive with Go Drive',
            loginSub:'Log in to continue', signupSub:'Create your account',
            fullName:'Full Name', phone:'Phone Number', email:'Email', password:'Password',
            createAccount:'Create Account', logIn:'Log In', noAccount:'No account?', haveAccount:'Already have an account?',
            signUp:'Sign up', logInLink:'Log in',
            iAm:'I am', male:'Male', female:'Female',
            whereTo:'Where to?', chooseRide:'Choose a ride', driverPref:'Driver preference',
            either:'Either', femaleDriver:'Female driver', maleDriver:'Male driver',
            confirm:'Confirm', logout:'Logout', welcome:'Welcome',
            youOnline:'You are online', youOffline:'You are offline',
            goOnline:'Go Online', goOffline:'Go Offline', liveRequests:'Live Requests',
            goOnlineToSee:'Go online to see ride requests', waitingRequests:'Waiting for requests...',
            accept:'Accept', history:'Ride history', earnings:'Earnings',
            searching:'Searching for a driver...', accepted:'Driver is on the way',
            arrived:'Driver has arrived', inProgress:'On trip', completed:'Trip completed', cancelled:'Ride cancelled'
        },
        ur: {
            ride:'رائیڈ', drive:'ڈرائیو', admin:'ایڈمن',
            rideTitle:'گو ڈرائیو کے ساتھ سفر کریں', driveTitle:'گو ڈرائیو کے ساتھ ڈرائیو کریں',
            loginSub:'جاری رکھنے کے لیے لاگ اِن کریں', signupSub:'اپنا اکاؤنٹ بنائیں',
            fullName:'پورا نام', phone:'فون نمبر', email:'ای میل', password:'پاسورڈ',
            createAccount:'اکاؤنٹ بنائیں', logIn:'لاگ اِن', noAccount:'اکاؤنٹ نہیں ہے؟', haveAccount:'پہلے سے اکاؤنٹ ہے؟',
            signUp:'سائن اپ', logInLink:'لاگ اِن کریں',
            iAm:'میں ہوں', male:'مرد', female:'عورت',
            whereTo:'کہاں جانا ہے؟', chooseRide:'رائیڈ منتخب کریں', driverPref:'ڈرائیور کی ترجیح',
            either:'کوئی بھی', femaleDriver:'خاتون ڈرائیور', maleDriver:'مرد ڈرائیور',
            confirm:'تصدیق کریں', logout:'لاگ آؤٹ', welcome:'خوش آمدید',
            youOnline:'آپ آن لائن ہیں', youOffline:'آپ آف لائن ہیں',
            goOnline:'آن لائن ہوں', goOffline:'آف لائن ہوں', liveRequests:'موجودہ درخواستیں',
            goOnlineToSee:'رائیڈ درخواستیں دیکھنے کے لیے آن لائن ہوں', waitingRequests:'درخواستوں کا انتظار ہے...',
            accept:'قبول کریں', history:'رائیڈ کی تاریخ', earnings:'کمائی',
            searching:'ڈرائیور تلاش کیا جا رہا ہے...', accepted:'ڈرائیور راستے میں ہے',
            arrived:'ڈرائیور پہنچ گیا ہے', inProgress:'سفر جاری ہے', completed:'سفر مکمل ہوا', cancelled:'رائیڈ منسوخ ہوئی'
        }
    };
    function t(key) { return (STR[state.lang] && STR[state.lang][key]) || STR.en[key] || key; }

    // ================== APP STATE ==================
    const ADMIN_LINK_REQUESTED = new URLSearchParams(location.search).has('admin');
    let state = {
        view: ADMIN_LINK_REQUESTED ? 'admin' : 'rider',
        session: null,
        profile: null,
        loadingAuth: true,
        lang: 'en',
        fareSettings: [],
        appContent: {},
        cities: []
    };
    // The Admin tab in the top nav is only shown to people who arrived via the
    // secret ?admin link, or who are already signed in as an admin. Everyone
    // else just sees Ride / Drive, so the admin login isn't publicly advertised.
    function adminTabVisible() { return ADMIN_LINK_REQUESTED || state.view === 'admin' || state.profile?.role === 'admin'; }
    let riderState = { screen: 'auth', authMode:'login', form:{}, err:'', vehicle:'car',
        pickup:'Layyah Bus Stand', pickupLat: PLACES['Layyah Bus Stand'].lat, pickupLng: PLACES['Layyah Bus Stand'].lng,
        dropoff:'Chowk Azam', dropoffLat: PLACES['Chowk Azam'].lat, dropoffLng: PLACES['Chowk Azam'].lng,
        pickupSuggestions:null, dropoffSuggestions:null, pickupDebounce:null, dropoffDebounce:null,
        fare:300, genderPref:'any', loading:false, activeRide:null, rideChannel:null, ratingDraft:{stars:0, comment:''}, sosSent:false, onlineCount:null, searchTick:null, history:null };
    let driverState = { screen: 'auth', authMode:'login', form:{}, err:'', rides:[], searchChannel:null, watchId:null, online:false, activeRide:null, rideChannel:null, ratingDraft:{stars:0, comment:''}, verify:{form:{}, files:{}, err:'', loading:false}, sosSent:false, history:null, earnings:null, headingTo:null, withdrawals:null, wdForm:{} };
    let adminState = { screen:'auth', authMode:'login', form:{}, err:'', tab:'overview', rides:[], drivers:[], cities:[], sosAlerts:[], sosChannel:null, withdrawals:[], reviewDriver:null, reviewDocs:null, reviewNotes:'', reviewErr:'', reviewLoading:false, users:[], fareSettings:[], content:{}, userMsg:'', fareMsg:'', contentMsg:'', cityMsg:'', adminMsg:'', newCity:{name:'',province:''}, newAdmin:{email:'',managed_city_id:''} };
    function cityName(id) { const c = adminState.cities.find(c => c.id === id); return c ? c.name : id; }

    // ================== AUTH HELPERS ==================
    async function refreshSession() {
        const { data } = await sb.auth.getSession();
        state.session = data.session;
        if (state.session) {
            const { data: profile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
            state.profile = profile;
        } else {
            state.profile = null;
        }
        state.loadingAuth = false;
    }

    let passwordResetMode = false;
    sb.auth.onAuthStateChange((_event, session) => {
        state.session = session;
        if (_event === 'PASSWORD_RECOVERY') { passwordResetMode = true; render(); return; }
        if (session) {
            sb.from('profiles').select('*').eq('id', session.user.id).single().then(({data}) => {
                state.profile = data;
                render();
            });
        } else {
            state.profile = null;
            render();
        }
    });

    // Sends the user a password-reset email via Supabase's own recovery flow.
    // `role` picks which login form's email field to read from (rider/driver/admin).
    async function requestPasswordReset(role) {
        const target = role === 'admin' ? adminState : (role === 'rider' ? riderState : driverState);
        const email = target.form.email;
        if (!email) { target.err = 'Enter your email above first, then tap "Forgot password?"'; target.resetMsg=''; render(); return; }
        target.err = ''; target.resetMsg = 'Sending...'; render();
        const redirectTo = window.location.origin + window.location.pathname + (role === 'admin' ? '?admin&reset=1' : '?reset=1');
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) { target.err = error.message; target.resetMsg=''; }
        else { target.resetMsg = `If an account exists for ${email}, a password reset link has been sent. Check your email.`; }
        render();
    }

    function renderPasswordResetScreen() {
        return `
            <div style="padding:80px 16px 16px;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
                <div class="fade-in" style="max-width:400px;width:100%;">
                    <h2 style="font-size:24px;font-weight:700;margin-bottom:8px;">Set a new password</h2>
                    <p style="color:#757575;margin-bottom:24px;">Choose a new password for your account.</p>

    async function submitNewPassword() {
        const pw1 = document.getElementById('pw-reset-new').value;

    async function doSignUp(target, email, password, fullName, role, phone, gender, emergencyName, emergencyPhone) {
        target.err = '';
        const city_id = await detectCityId();
        const { data, error } = await sb.auth.signUp({
            email, password,
            options: { data: {
                full_name: fullName, role, phone, gender,
                emergency_contact_name: emergencyName || null,
                emergency_contact_phone: emergencyPhone || null,

        if (error) { target.err = error.message; render(); return; }
        if (data.session) { await refreshSession(); render(); }
        else { target.err = 'Check your email to confirm your account, then log in.'; target.authMode='login'; render(); }
    }

    // Best-effort region detection: matches the browser's geolocation against active cities' bounding boxes.
    // Falls back to 'layyah' (today's only active city) if location is unavailable or outside any known city.
    async function detectCityId() {
        try {
            const { data: cities } = await sb.from('cities').select('*').eq('is_active', true);
            if (!cities || cities.length === 0) return 'layyah';
            if (!navigator.geolocation) return 'layyah';
            const pos = await new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(resolve, () => resolve(null), { timeout: 4000 });
            });
            if (!pos) return 'layyah';
            const { latitude, longitude } = pos.coords;
            const match = cities.find(c => {
                const b = c.bounds;
                if (!b) return false;
                return latitude >= b.minLat && latitude <= b.maxLat && longitude >= b.minLng && longitude <= b.maxLng;
            });
            return match ? match.id : 'layyah';
        } catch (e) {
            return 'layyah';
        }
    }

    async function doSignIn(target, email, password, requiredRole) {
        target.err = '';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { target.err = error.message; render(); return; }
        const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
        if (requiredRole && profile?.role !== requiredRole) {
            target.err = `This account is registered as "${profile?.role}", not "${requiredRole}".`;
            await sb.auth.signOut();
            render(); return;
        }
        state.session = data.session; state.profile = profile;
        render();
    }

    async function doSignOut() {
        if (state.profile?.role === 'driver') {
            await sb.from('profiles').update({ is_online: false }).eq('id', state.session.user.id);
        }
        await sb.auth.signOut();
        render();
    }

        const activeEl = document.activeElement;

            activeCapture = { id: activeEl.id, value: activeEl.value, selStart: null, selEnd: null };
            // Reading selectionStart/selectionEnd throws for input types like
            // email/number/date — those simply don't support cursor selection.
            // Guard it so the whole render() doesn't crash when one of those is focused.
            try { activeCapture.selStart = activeEl.selectionStart; activeCapture.selEnd = activeEl.selectionEnd; } catch (e) {}

            if (el) {
                // Only re-apply the captured value if the freshly-rendered element didn't
                // already carry a newer value from state (avoids clobbering real updates).
                if (el.value === '' || el.value == null) el.value = activeCapture.value;
                el.focus({ preventScroll: true });
                if (typeof activeCapture.selStart === 'number' && el.setSelectionRange) {
                    try { el.setSelectionRange(activeCapture.selStart, activeCapture.selEnd); } catch(e) {}
                }
            }

    // render() rebuilds the whole page's HTML, which would normally steal focus from

    function restoreInputFocus() {

    function syncBookingPreviewMap() {
        const map = ensureMap();

        if (riderState.pickupLat) {

    // ================== ADDRESS AUTOCOMPLETE (LocationIQ) ==================
    function renderAddressField(field) {
        const isPickup = field === 'pickup';
        const value = riderState[field];
        return `
            <div style="position:relative;margin-bottom:12px;">
                <div class="input-group" style="margin-bottom:0;">
                    <div style="margin-right:12px;">${isPickup ? Icons.pin : `<div style="width:20px;height:20px;background:#000;border-radius:4px;"></div>`}</div>
                    <input type="text" id="addr-${field}" value="${value.replace(/"/g,'&quot;')}" placeholder="${isPickup ? 'Pickup location' : 'Where to?'}"
                        oninput="onAddressInput('${field}', this.value)"
                        onfocus="riderState.activeField='${field}'"
                        style="background:transparent;border:none;outline:none;width:100%;font-size:15px;">
                </div>
                <div id="sugg-${field}">${renderSuggestionsBox(field)}</div>
            </div>
        `;
    }
    function renderSuggestionsBox(field) {
        const suggestions = riderState[field + 'Suggestions'];
        if (suggestions && suggestions.length > 0) {
            return `
                <div style="position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.1);z-index:10;max-height:220px;overflow-y:auto;margin-top:4px;">
                    ${suggestions.map((s, i) => `
                        <div onclick="selectSuggestion('${field}', ${i})" style="padding:12px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f6f6f6;" onmouseover="this.style.background='#f9f9f9'" onmouseout="this.style.background='#fff'">${s.display_name}</div>
                    `).join('')}
                </div>
            `;
        } else if (suggestions && suggestions.length === 0 && riderState[field + 'Query']) {
            return `<div style="position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px;font-size:13px;color:#999;margin-top:4px;z-index:10;">No matches — try the quick picks below</div>`;
        }
        return '';
    }
    // Updates only the suggestions dropdown DOM node, never the input itself,
    // so the on-screen keyboard doesn't flicker/jump on every keystroke.
    function renderSuggestionsOnly(field) {
        const el = document.getElementById('sugg-' + field);
        if (el) el.innerHTML = renderSuggestionsBox(field);
    }
    function onAddressInput(field, query) {
        riderState[field] = query;
        riderState[field + 'Query'] = query;
        riderState.activeField = field;
        const debounceKey = field + 'Debounce';
        if (riderState[debounceKey]) clearTimeout(riderState[debounceKey]);
        if (query.trim().length < 3) { riderState[field + 'Suggestions'] = null; renderSuggestionsOnly(field); return; }
        riderState[debounceKey] = setTimeout(() => fetchAddressSuggestions(field, query), 450);
    }
    async function fetchAddressSuggestions(field, query) {
        try {
            let url = `https://api.locationiq.com/v1/autocomplete?key=${LOCATIONIQ_KEY}&q=${encodeURIComponent(query)}&countrycodes=pk&limit=5&format=json`;
            const city = state.cities.find(c => c.id === state.profile?.city_id);
            if (city && city.bounds) {
                const b = city.bounds;
                // viewbox = left(minLng),top(maxLat),right(maxLng),bottom(minLat) — bounded=1 restricts results to inside this box
                url += `&viewbox=${b.minLng},${b.maxLat},${b.maxLng},${b.minLat}&bounded=1`;
            }
            const res = await fetch(url);
            const data = await res.json();
            riderState[field + 'Suggestions'] = Array.isArray(data) ? data : [];
        } catch (e) {
            riderState[field + 'Suggestions'] = [];
        }
        renderSuggestionsOnly(field);
    }
    function selectSuggestion(field, index) {
        const s = riderState[field + 'Suggestions'][index];
        if (!s) return;
        riderState[field] = s.display_name;
        riderState[field + 'Lat'] = parseFloat(s.lat);
        riderState[field + 'Lng'] = parseFloat(s.lon);
        riderState[field + 'Suggestions'] = null;
        render();
    }
    function pickPreset(field, name) {
        const p = PLACES[name];
        if (!p) return;
        riderState[field] = name;
        riderState[field + 'Lat'] = p.lat;
        riderState[field + 'Lng'] = p.lng;
        riderState[field + 'Suggestions'] = null;
        render();
    }

    // ================== RIDE HISTORY (shared) ==================
    function openHistory(who) {
        const target = who === 'rider' ? riderState : driverState;
        target.screen = 'history';
        target.history = null;
        render();
        const col = who === 'rider' ? 'rider_id' : 'driver_id';
        sb.from('rides').select('*').eq(col, state.session.user.id).in('status', ['completed', 'cancelled'])
            .order('created_at', { ascending: false }).limit(50).then(({ data }) => {
                target.history = data || [];
                render();
            });
    }
    function closeHistory(who) {
        const target = who === 'rider' ? riderState : driverState;
        target.screen = who === 'rider' ? 'book' : 'dash';
        render();
    }

    // ================== DRIVER EARNINGS ==================
    function openEarnings() {
        driverState.screen = 'earnings';
        driverState.earnings = null;
        driverState.withdrawals = null;
        render();
        sb.from('rides').select('fare,driver_earning,created_at').eq('driver_id', state.session.user.id).eq('status', 'completed')
            .order('created_at', { ascending: false }).then(({ data }) => {
                driverState.earnings = data || [];
                render();
            });
        sb.from('withdrawal_requests').select('*').eq('driver_id', state.session.user.id)
            .order('requested_at', { ascending: false }).then(({ data }) => {
                driverState.withdrawals = data || [];
                render();
            });
    }
    function closeEarnings() { driverState.screen = 'dash'; render(); }
    function renderEarnings() {
        const rows = driverState.earnings;
        const withdrawals = driverState.withdrawals;
        if (rows === null || withdrawals === null) {
            return `<div style="padding:80px 16px 16px;min-height:100vh;background:#fff;text-align:center;color:#757575;">Loading...</div>`;
        }
        const now = new Date();
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfDay.getDate() - startOfDay.getDay());
        const sum = (list) => list.reduce((s, r) => s + Number(r.driver_earning || r.fare * 0.8), 0);
        const today = rows.filter(r => new Date(r.created_at) >= startOfDay);
        const week = rows.filter(r => new Date(r.created_at) >= startOfWeek);
        const totalEarned = sum(rows);
        const claimed = withdrawals.filter(w => w.status !== 'rejected').reduce((s, w) => s + Number(w.amount), 0);
        const available = Math.max(0, totalEarned - claimed);
        const f = driverState.wdForm;
        return `
            <div style="padding:80px 16px 16px;min-height:100vh;background:#fff;">
                <div style="max-width:500px;margin:0 auto;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                        <h2 style="font-size:22px;font-weight:700;">Earnings</h2>
                        <button onclick="closeEarnings()" class="link-btn">Back</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                        <div style="background:#f6f6f6;padding:18px;border-radius:8px;">
                            <div style="font-size:12px;color:#757575;">Today</div>
                            <div style="font-size:20px;font-weight:700;margin-top:4px;">Rs ${sum(today).toFixed(0)}</div>
                            <div style="font-size:11px;color:#999;margin-top:2px;">${today.length} ride${today.length===1?'':'s'}</div>
                        </div>
                        <div style="background:#f6f6f6;padding:18px;border-radius:8px;">
                            <div style="font-size:12px;color:#757575;">This Week</div>
                            <div style="font-size:20px;font-weight:700;margin-top:4px;">Rs ${sum(week).toFixed(0)}</div>
                            <div style="font-size:11px;color:#999;margin-top:2px;">${week.length} ride${week.length===1?'':'s'}</div>
                        </div>
                        <div style="background:#000;color:#fff;padding:18px;border-radius:8px;grid-column:1/3;">
                            <div style="font-size:12px;color:#ccc;">All Time</div>
                            <div style="font-size:26px;font-weight:700;margin-top:4px;">Rs ${totalEarned.toFixed(0)}</div>
                            <div style="font-size:11px;color:#999;margin-top:2px;">${rows.length} completed ride${rows.length===1?'':'s'}</div>
                        </div>
                    </div>
                    <div style="font-size:12px;color:#999;text-align:center;margin-bottom:20px;">Earnings reflect 80% of fare after the platform's 20% commission.</div>

                    <div style="border-top:1px solid #eee;padding-top:20px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="font-weight:600;font-size:15px;">Available to withdraw</div>
                            <div style="font-weight:700;font-size:18px;">Rs ${available.toFixed(0)}</div>
                        </div>
                        ${driverState.wdErr ? `<div class="err">${driverState.wdErr}</div>` : ''}
                        <input id="wd-amount" class="plain-input" type="number" placeholder="Amount (Rs)" value="${f.amount || ''}" oninput="driverState.wdForm.amount=this.value">
                        <div style="display:flex;gap:8px;margin-bottom:12px;">
                            <div onclick="driverState.wdForm.method='jazzcash';render()" class="gender-pill" style="border-color:${f.method==='jazzcash'?'#000':'#eee'};background:${f.method==='jazzcash'?'#f6f6f6':'#fff'};">JazzCash</div>
                            <div onclick="driverState.wdForm.method='easypaisa';render()" class="gender-pill" style="border-color:${f.method==='easypaisa'?'#000':'#eee'};background:${f.method==='easypaisa'?'#f6f6f6':'#fff'};">Easypaisa</div>
                        </div>
                        <input id="wd-account" class="plain-input" placeholder="Account number" value="${f.account || ''}" oninput="driverState.wdForm.account=this.value">
                        <button onclick="requestWithdrawal(${available})" class="uber-btn">Request Withdrawal</button>
                    </div>

                    ${withdrawals.length > 0 ? `
                        <div style="margin-top:24px;">
                            <div style="font-weight:600;font-size:14px;margin-bottom:10px;">Withdrawal history</div>
                            ${withdrawals.map(w => `
                                <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;border-radius:8px;padding:12px 14px;margin-bottom:8px;">
                                    <div>
                                        <div style="font-weight:600;font-size:14px;">Rs ${w.amount}</div>
                                        <div style="font-size:12px;color:#757575;text-transform:capitalize;">${w.method} · ${new Date(w.requested_at).toLocaleDateString()}</div>
                                    </div>
                                    <span style="background:${w.status==='pending'?'#fff6e0':w.status==='paid'?'#e6f6ea':'#fdeaea'};color:${w.status==='pending'?'#8a6d1a':w.status==='paid'?'#1a8a3d':'#c0392b'};padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;text-transform:capitalize;">${w.status}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
    }
    async function requestWithdrawal(available) {
        const f = driverState.wdForm;
        const amount = parseFloat(f.amount);
        driverState.wdErr = '';
        if (!amount || amount <= 0) { driverState.wdErr = 'Enter a valid amount.'; render(); return; }
        if (amount > available) { driverState.wdErr = `You can withdraw at most Rs ${available.toFixed(0)}.`; render(); return; }
        if (!f.method) { driverState.wdErr = 'Choose JazzCash or Easypaisa.'; render(); return; }
        if (!f.account) { driverState.wdErr = 'Enter your account number.'; render(); return; }
        const { error } = await sb.from('withdrawal_requests').insert({
            driver_id: state.session.user.id, amount, method: f.method, account_number: f.account, city_id: state.profile.city_id
        });
        if (error) { driverState.wdErr = error.message; render(); return; }
        driverState.wdForm = {};
        openEarnings();
    }
    function renderHistory(who) {
        const target = who === 'rider' ? riderState : driverState;
        const rides = target.history;
        return `
            <div style="padding:80px 16px 16px;min-height:100vh;background:#fff;">
                <div style="max-width:500px;margin:0 auto;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                        <h2 style="font-size:22px;font-weight:700;">Ride History</h2>
                        <button onclick="closeHistory('${who}')" class="link-btn">Back</button>
                    </div>
                    ${rides === null ? `<div style="color:#757575;text-align:center;padding:32px;">Loading...</div>` :
                        rides.length === 0 ? `<div style="background:#f6f6f6;padding:32px;border-radius:8px;text-align:center;color:#757575;">No past rides yet.</div>` :
                        rides.map(r => `
                            <div style="border:1px solid #eee;border-radius:8px;padding:16px;margin-bottom:10px;">
                                <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                                    <span style="font-weight:700;">Rs ${r.fare}</span>
                                    <span style="font-size:12px;color:${r.status==='completed'?'#1a8a3d':'#c0392b'};text-transform:capitalize;font-weight:600;">${r.status}</span>
                                </div>
                                <div style="font-size:13px;color:#757575;margin-bottom:4px;">${r.pickup_address} → ${r.dropoff_address}</div>
                                <div style="font-size:12px;color:#999;">${new Date(r.created_at).toLocaleString()}${who==='rider' && r.rating ? ` · You rated ★ ${r.rating}` : ''}${who==='driver' && r.driver_rating ? ` · Rider rated you ★ ${r.driver_rating}` : ''}</div>
                            </div>
                        `).join('')
                    }
                </div>
            </div>
        `;
    }

    async function fetchOnlineDriverCount() {
        riderState.onlineCount = -1; // loading marker
        render();
        const { count } = await sb.from('profiles').select('id', { count: 'exact', head: true })
            .eq('role', 'driver').eq('city_id', state.profile.city_id).eq('is_online', true).eq('is_verified', true);
        riderState.onlineCount = count ?? 0;
        render();
    }

    function renderAuthScreen(target, role, title) {
        const isSignup = target.authMode === 'signup';
        const titleText = role === 'rider' ? t('rideTitle') : t('driveTitle');
        return `
            <div style="padding:80px 16px 16px;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
                <div class="fade-in" style="max-width:400px;width:100%;">
                    <h2 style="font-size:28px;font-weight:700;margin-bottom:8px;">${titleText}</h2>
                    <p style="color:#757575;margin-bottom:24px;">${isSignup ? t('signupSub') : t('loginSub')}</p>
                    ${target.err ? `<div class="err">${target.err}</div>` : ''}
                    ${isSignup ? `<input id="auth-${role}-name" class="plain-input" placeholder="${t('fullName')}" value="${(target.form.name||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.name=this.value">` : ''}
                    ${isSignup ? `<input id="auth-${role}-phone" class="plain-input" placeholder="${t('phone')}" value="${(target.form.phone||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.phone=this.value">` : ''}
                    <input id="auth-${role}-email" type="email" autocomplete="${isSignup ? 'email' : 'username'}" class="plain-input" placeholder="${t('email')}" value="${(target.form.email||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.email=this.value">
                    <input id="auth-${role}-password" type="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" class="plain-input" placeholder="${t('password')}" value="${(target.form.password||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.password=this.value">
                    ${!isSignup ? `<p style="text-align:right;margin:-4px 0 12px;"><button onclick="requestPasswordReset('${role}')" style="color:#757575;background:none;border:none;cursor:pointer;text-decoration:underline;font-size:13px;">Forgot password?</button></p>` : ''}
                    ${target.resetMsg ? `<div style="color:#1a7f37;font-size:13px;margin-bottom:12px;">${target.resetMsg}</div>` : ''}
                    ${isSignup ? `
                        <div style="font-size:13px;color:#757575;margin-bottom:8px;">${t('iAm')}</div>
                        <div style="display:flex;gap:8px;margin-bottom:12px;">
                            <div id="gender-pill-${role}-male" onclick="selectSignupGender('${role}','male')" class="gender-pill" style="border-color:${target.form.gender==='male'?'#000':'#eee'};background:${target.form.gender==='male'?'#f6f6f6':'#fff'};">${t('male')}</div>
                            <div id="gender-pill-${role}-female" onclick="selectSignupGender('${role}','female')" class="gender-pill" style="border-color:${target.form.gender==='female'?'#000':'#eee'};background:${target.form.gender==='female'?'#f6f6f6':'#fff'};">${t('female')}</div>
                        </div>
                        ${role === 'driver' ? `<div style="font-size:12px;color:#757575;margin:-4px 0 12px;">Female drivers can choose to only accept rides from female riders when booking permits it.</div>` : ''}
                        <div style="font-size:13px;color:#757575;margin-bottom:8px;">Emergency contact (used only if you trigger the SOS button)</div>
                        <input id="auth-${role}-emname" class="plain-input" placeholder="Emergency contact name (optional)" value="${(target.form.emergencyName||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.emergencyName=this.value">
                        <input id="auth-${role}-emphone" class="plain-input" placeholder="Emergency contact phone (optional)" value="${(target.form.emergencyPhone||'').replace(/"/g,'&quot;')}" oninput="${role}State.form.emergencyPhone=this.value">
                    ` : ''}
                    <button onclick="submitAuth('${role}')" class="uber-btn">${isSignup ? t('createAccount') : t('logIn')}</button>
                    <p style="text-align:center;font-size:14px;color:#757575;margin-top:24px;">
                        ${isSignup ? t('haveAccount') : t('noAccount')}
                        <button onclick="${role}State.authMode='${isSignup?'login':'signup'}';${role}State.err='';render()" style="color:#000;background:none;border:none;cursor:pointer;text-decoration:underline;">${isSignup ? t('logInLink') : t('signUp')}</button>
                    </p>
                    <p style="text-align:center;margin-top:16px;">
                        <button onclick="state.view='privacy';render()" class="link-btn">Privacy Policy &amp; Terms</button>
                    </p>
                </div>
            </div>
        `;
    }

    function submitAuth(role) {
        const target = role === 'rider' ? riderState : driverState;
        const f = target.form;
        if (!f.email || !f.password) { target.err = 'Email and password required'; render(); return; }
        if (target.authMode === 'signup') {
            if (!f.name) { target.err = 'Name required'; render(); return; }
            if (!f.gender) { target.err = 'Please select your gender'; render(); return; }
            doSignUp(target, f.email, f.password, f.name, role, f.phone || null, f.gender, f.emergencyName, f.emergencyPhone);
        } else {
            doSignIn(target, f.email, f.password, role);
        }
    }

    // Selecting a gender during signup used to call a full render(), which
    // rebuilds the whole page's HTML and can wipe out anything typed in the
    // other fields. This instead only touches the two pill elements directly,
    // so the name/phone/email/password fields are never recreated at all.
    function selectSignupGender(role, value) {
        const target = role === 'admin' ? adminState : (role === 'rider' ? riderState : driverState);
        target.form.gender = value;
        const maleEl = document.getElementById(`gender-pill-${role}-male`);
        const femaleEl = document.getElementById(`gender-pill-${role}-female`);
        if (maleEl) { maleEl.style.borderColor = value === 'male' ? '#000' : '#eee'; maleEl.style.background = value === 'male' ? '#f6f6f6' : '#fff'; }
        if (femaleEl) { femaleEl.style.borderColor = value === 'female' ? '#000' : '#eee'; femaleEl.style.background = value === 'female' ? '#f6f6f6' : '#fff'; }
    }
    function adjustFare(delta) {
        riderState.fare = Math.max(20, (riderState.fare || 0) + delta);
        render();
    }
    async function bookRide() {
        riderState.err = '';
        if (riderState.pickup === riderState.dropoff) { riderState.err = 'Pickup and dropoff cannot be the same'; render(); return; }
        if (!riderState.pickupLat || !riderState.dropoffLat) { riderState.err = 'Please select a pickup and dropoff from the search results or quick picks.'; render(); return; }
        riderState.loading = true; render();
        const { data, error } = await sb.from('rides').insert({
            rider_id: state.session.user.id,
            rider_name: state.profile.full_name,
            rider_phone: state.profile.phone || 'N/A',
            pickup_address: riderState.pickup, dropoff_address: riderState.dropoff,
            pickup_lat: riderState.pickupLat, pickup_lng: riderState.pickupLng,
            dropoff_lat: riderState.dropoffLat, dropoff_lng: riderState.dropoffLng,
            vehicle_type: riderState.vehicle, fare: riderState.fare, status: 'searching',
            city_id: state.profile.city_id, gender_preference: riderState.genderPref
        }).select().single();
        riderState.loading = false;
        if (error) { riderState.err = error.message; render(); return; }
        riderState.activeRide = data;
        riderState.ratingDraft = { stars: 0, comment: '' };
        riderState.sosSent = false;
        riderState.onlineCount = null;
        if (riderState.searchTick) clearInterval(riderState.searchTick);
        riderState.searchTick = setInterval(() => {
            if (riderState.activeRide && riderState.activeRide.status === 'searching') render();
            else { clearInterval(riderState.searchTick); riderState.searchTick = null; }
        }, 5000);
        subscribeToRide(data.id, (updated) => { riderState.activeRide = updated; render(); }, 'rider');
        render();
    }

    function renderSearchDelayNotice(r) {
        const elapsedSec = (Date.now() - new Date(r.created_at).getTime()) / 1000;
        if (elapsedSec < 45) return '';
        return `
            <div style="background:#fff7f7;border:1px solid #f3d6d6;padding:12px 14px;border-radius:8px;margin-bottom:16px;">
                <div style="font-size:13px;color:#8a2f2f;margin-bottom:${r.gender_preference !== 'any' ? '10px' : '0'};">This is taking longer than usual. You can keep waiting or cancel and try again.</div>
                ${r.gender_preference !== 'any' ? `<button onclick="widenGenderSearch('${r.id}')" class="uber-btn-outline uber-btn" style="font-size:13px;padding:8px;">Widen search to any driver</button>` : ''}
            </div>
        `;
    }
    async function widenGenderSearch(rideId) {
        await sb.from('rides').update({ gender_preference: 'any' }).eq('id', rideId);
    }

    // ================== SHARED: REALTIME TRACKING ==================
    function subscribeToRide(rideId, onUpdate, who) {
        const channel = sb.channel('ride-' + rideId)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rides', filter: `id=eq.${rideId}` },
                (payload) => onUpdate(payload.new))
            .subscribe();
        if (who === 'rider') riderState.rideChannel = channel;
        else driverState.rideChannel = channel;
    }

                        <div style="color:#757575;font-size:14px;margin-top:4px;">${etaText}</div>

                            <div style="font-weight:700;font-size:22px;margin-bottom:12px;">Rs ${r.suggested_fare} <span style="font-size:13px;font-weight:400;color:#757575;">(you asked Rs ${r.fare})</span></div>

                            </div>

                    <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">

                            <div style="display:flex;align-items:center;gap:4px;color:#757575;font-size:14px;">${who==='rider' ? (r.driver_phone||'') : (r.rider_phone||'')}</div>
                        </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid #eee;margin-bottom:16px;">
                        <div><div style="font-size:13px;color:#757575;">Payment</div><div style="font-weight:600;text-transform:capitalize;">${r.payment_method || 'Cash'}</div></div>
                        <div style="text-align:right;"><div style="font-size:13px;color:#757575;">Fare</div><div style="font-weight:700;font-size:20px;">Rs ${r.fare}</div></div>

                    ${showDriverActions && r.status === 'accepted' ? `<button onclick="advanceRide('${r.id}','arrived_pickup')" class="uber-btn">Arrived at Pickup</button>` : ''}

                    ${showDriverActions && r.status === 'in_progress' ? `<button onclick="advanceRide('${r.id}','completed',${r.fare})" class="uber-btn">Complete Trip</button>` : ''}
                    ${showRiderActions && r.status === 'searching' ? `<button onclick="cancelRide('${r.id}')" class="uber-btn-outline uber-btn">Cancel Request</button>` : ''}
                    ${r.status !== 'searching' && !['completed','cancelled'].includes(r.status) ? renderWhatsAppShare(r, who) : ''}
                    ${r.status === 'completed' ? renderRatingBlock(r, who) : ''}
                    ${(r.status === 'cancelled') ? `<button onclick="finishRide('${who}')" class="uber-btn">Done</button>` : ''}
                    ${!['completed','cancelled'].includes(r.status) ? renderSosBlock(r, who) : ''}
                </div>
            </div>
        `;
    }

    // ================== SOS / EMERGENCY ==================
    function renderSosBlock(r, who) {
        const target = who === 'rider' ? riderState : driverState;
        if (target.sosSent) {
            return `
                <div style="margin-top:14px;background:#fdeaea;border:1px solid #f3caca;padding:12px;border-radius:8px;text-align:center;">
                    <div style="font-weight:700;color:#c0392b;font-size:14px;">Alert sent to admins</div>
                    <div style="font-size:12px;color:#8a2f2f;margin-top:2px;">If this is a life-threatening emergency, call local emergency services now.</div>
                </div>
            `;
        }
        return `
            <div style="margin-top:14px;">
                <button onclick="triggerSOS('${who}','${r.id}')" class="sos-btn">🚨 Emergency SOS</button>
                <div style="font-size:11px;color:#999;text-align:center;margin-top:6px;">Alerts platform admins. For immediate danger, call emergency services directly.</div>
            </div>
        `;
    }

    async function triggerSOS(who, rideId) {
        const target = who === 'rider' ? riderState : driverState;
        if (!confirm('This will alert Go Drive admins that you feel unsafe. Continue?')) return;

        let lat = null, lng = null;
        try {
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 4000 });
            });
            lat = pos.coords.latitude; lng = pos.coords.longitude;
        } catch (e) { /* fall back to no coords */ }

        const { error } = await sb.from('sos_alerts').insert({
            ride_id: rideId,
            triggered_by: state.session.user.id,
            triggered_by_role: who,
            triggered_by_name: state.profile.full_name,
            triggered_by_phone: state.profile.phone || 'N/A',
            city_id: state.profile.city_id,
            lat, lng
        });
        if (error) { alert('Could not send alert: ' + error.message + '. If you are in danger, call emergency services now.'); return; }
        target.sosSent = true;
        render();
    }

    // ================== WHATSAPP LIVE TRIP SHARING ==================
    function formatPhoneIntl(phone) {
        if (!phone) return '';
        const digits = phone.replace(/\D/g, '');
        if (digits.startsWith('92')) return digits;
        if (digits.startsWith('0')) return '92' + digits.slice(1);
        return digits;
    }
    function renderWhatsAppShare(r, who) {
        const hasContact = !!state.profile.emergency_contact_phone;
        return `
            <button onclick="shareRideOnWhatsApp('${r.id}','${who}')" style="background:#25D366;color:#fff;padding:14px;border-radius:8px;width:100%;font-weight:700;font-size:15px;border:none;cursor:pointer;margin-top:10px;">
                📍 Share Live Ride on WhatsApp
            </button>
            <div style="font-size:11px;color:#999;text-align:center;margin-top:6px;">${hasContact ? "Sends your trip details to your emergency contact." : "No emergency contact on file — you'll be asked for a number."}</div>
        `;
    }
    function shareRideOnWhatsApp(rideId, who) {
        const r = who === 'rider' ? riderState.activeRide : driverState.activeRide;
        if (!r) return;
        let toPhone = state.profile.emergency_contact_phone;
        if (!toPhone) {
            toPhone = prompt("Enter the phone number to share this ride with (e.g. 03001234567):");
            if (!toPhone) return;
        }
        const otherName = who === 'rider' ? (r.driver_name || 'a Go Drive driver') : r.rider_name;
        const otherPhone = who === 'rider' ? (r.driver_phone || 'N/A') : (r.rider_phone || 'N/A');
        const vehicle = who === 'rider' ? `${r.vehicle_type}${r.driver_plate ? ' · ' + r.driver_plate : ''}` : r.vehicle_type;
        const msg = who === 'rider'
            ? `I'm on a Go Drive ride and sharing my trip for safety.\n\nDriver: ${otherName}\nPhone: ${otherPhone}\nVehicle: ${vehicle}\nFrom: ${r.pickup_address}\nTo: ${r.dropoff_address}\nFare: Rs ${r.fare}\n\nI'll message again when I arrive.`
            : `I'm driving a Go Drive rider and sharing the trip for safety.\n\nRider: ${otherName}\nPhone: ${otherPhone}\nFrom: ${r.pickup_address}\nTo: ${r.dropoff_address}\n\nI'll message again when the trip ends.`;
        const url = `https://wa.me/${formatPhoneIntl(toPhone)}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }

    // ================== RATINGS ==================
    function renderRatingBlock(r, who) {
        const alreadyRated = who === 'rider' ? (r.rating != null) : (r.driver_rating != null);
        if (alreadyRated) {
            return `
                <div style="text-align:center;padding:12px 0 4px;">
                    <div style="color:#757575;font-size:14px;margin-bottom:16px;">Thanks for your rating!</div>
                    <button onclick="finishRide('${who}')" class="uber-btn">Done</button>
                </div>
            `;
        }
        const target = who === 'rider' ? riderState : driverState;
        const draft = target.ratingDraft;
        const rateeLabel = who === 'rider' ? (r.driver_name || 'your driver') : (r.rider_name || 'your rider');
        return `
            <div style="border-top:1px solid #eee;padding-top:16px;">
                <div style="font-weight:600;margin-bottom:10px;">Rate ${rateeLabel}</div>
                <div style="display:flex;gap:6px;margin-bottom:12px;">
                    ${[1,2,3,4,5].map(n => `
                        <button onclick="setRatingStars('${who}',${n})" style="background:none;border:none;cursor:pointer;padding:0;opacity:${draft.stars >= n ? '1' : '0.25'};">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="#000"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>`).join('')}
                </div>
                <textarea id="rating-comment" oninput="riderStateOrDriverState('${who}').ratingDraft.comment=this.value" placeholder="Add a comment (optional)" style="width:100%;padding:12px;border:1px solid #eee;border-radius:8px;margin-bottom:12px;font-size:14px;resize:none;min-height:60px;font-family:inherit;">${draft.comment}</textarea>
                <button onclick="submitRating('${who}','${r.id}')" class="uber-btn" ${draft.stars===0?'disabled':''}>Submit Rating</button>
                <button onclick="finishRide('${who}')" class="uber-btn-outline uber-btn" style="margin-top:8px;">Skip</button>
            </div>
        `;
    }
    function riderStateOrDriverState(who) { return who === 'rider' ? riderState : driverState; }
    function setRatingStars(who, n) { riderStateOrDriverState(who).ratingDraft.stars = n; render(); }

    async function submitRating(who, rideId) {
        const target = riderStateOrDriverState(who);
        const { stars, comment } = target.ratingDraft;
        if (!stars) return;
        const update = who === 'rider'
            ? { rating: stars, rating_comment: comment || null }
            : { driver_rating: stars, driver_rating_comment: comment || null };
        const { data, error } = await sb.from('rides').update(update).eq('id', rideId).select().single();
        if (error) { alert('Could not submit rating: ' + error.message); return; }
        if (who === 'rider') riderState.activeRide = data; else driverState.activeRide = data;
        render();
    }

    async function advanceRide(rideId, status, fare) {
        const patch = { status, updated_at: new Date().toISOString() };
        if (status === 'completed' && fare != null) {
            patch.commission = +(fare * 0.2).toFixed(2);
            patch.driver_earning = +(fare * 0.8).toFixed(2);
        }
        await sb.from('rides').update(patch).eq('id', rideId);
    }
    async function acceptCounterOffer(rideId) {
        const { data, error } = await sb.from('rides').update({ status: 'accepted', fare: riderState.activeRide.suggested_fare }).eq('id', rideId).select().single();
        if (error) { alert(error.message); return; }
        riderState.activeRide = data;
        render();
    }
    async function declineCounterOffer(rideId) {
        const { data, error } = await sb.from('rides').update({ status: 'searching', driver_id: null, driver_name: null, driver_phone: null, suggested_fare: null }).eq('id', rideId).select().single();
        if (error) { alert(error.message); return; }
        riderState.activeRide = data;
        render();
    }
    async function cancelRide(rideId) {
        await sb.from('rides').update({ status: 'cancelled' }).eq('id', rideId);
    }
    function finishRide(who) {
        if (who === 'rider') {
            if(riderState.rideChannel) sb.removeChannel(riderState.rideChannel);
            riderState.activeRide = null;
            riderState.onlineCount = null;
            if (riderState.searchTick) { clearInterval(riderState.searchTick); riderState.searchTick = null; }
        }
        else { if(driverState.rideChannel) sb.removeChannel(driverState.rideChannel); driverState.activeRide = null; stopWatchingLocation(); startSearchListener(); }
        render();
    }

    function toggleCounterInput(rideId) {
        driverState.counterInputFor = driverState.counterInputFor === rideId ? null : rideId;
        render();
    }
    async function sendCounterOffer(rideId) {
        const input = document.getElementById('counter-' + rideId);
        const val = Number(input.value);
        if (!val || val <= 0) { alert('Enter a valid price.'); return; }
        const { data, error } = await sb.from('rides')
            .update({ driver_id: state.session.user.id, driver_name: state.profile.full_name, driver_phone: state.profile.phone || 'N/A', status: 'countered', suggested_fare: val })
            .eq('id', rideId).eq('status', 'searching')
            .select().single();
        if (error || !data) { alert('This ride is no longer available.'); fetchSearchingRides(); return; }
        driverState.pendingCounter = data;
        driverState.counterInputFor = null;
        if (driverState.searchChannel) { sb.removeChannel(driverState.searchChannel); driverState.searchChannel = null; }
        subscribeToRide(data.id, (updated) => {
            if (updated.status === 'accepted' && updated.driver_id === state.session.user.id && driverState.pendingCounter) {
                driverState.pendingCounter = null;
                driverState.ratingDraft = { stars: 0, comment: '' };
                driverState.sosSent = false;
            } else if (updated.status === 'searching') {
                driverState.pendingCounter = null;
                if (driverState.rideChannel) { sb.removeChannel(driverState.rideChannel); driverState.rideChannel = null; }
                alert('The rider declined your offer.');
                startSearchListener();
                render();
                return;
            }
            driverState.activeRide = updated.status === 'countered' ? null : updated;
            if (updated.status === 'countered') driverState.pendingCounter = updated;
            render();
        }, 'driver-pending');
        render();
    }
    async function cancelCounterOffer(rideId) {

        if (driverState.rideChannel) { sb.removeChannel(driverState.rideChannel); driverState.rideChannel = null; }

        render();

    function renderPendingCounterScreen(r) {

    // ================== DRIVER ==================

        return `

                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
                        <select onchange="setHeadingTo(this.value)" style="flex:1;padding:10px 12px;border:1px solid #eee;border-radius:8px;font-size:13px;background:#f6f6f6;">
                            <option value="">Not heading anywhere in particular</option>
                            ${Object.keys(PLACES).map(p => `<option value="${p}" ${driverState.headingTo===p?'selected':''}>Heading to: ${p}</option>`).join('')}
                        </select>
                    </div>
                    ${!driverState.online ? `<div style="background:#f6f6f6;padding:32px;border-radius:8px;text-align:center;color:#757575;">${t('goOnlineToSee')}</div>` :
                        filteredDriverRides().length === 0 ? `<div style="background:#f6f6f6;padding:32px;border-radius:8px;text-align:center;color:#757575;">${driverState.headingTo ? 'No requests along your route yet — ' : ''}${t('waitingRequests')}</div>` :

                            <div class="fade-in" style="border:1px solid #eee;padding:20px;border-radius:8px;margin-bottom:12px;">

            .on('postgres_changes', { event: '*', schema: 'public', table: 'rides', filter: `city_id=eq.${state.profile.city_id}` }, () => {
                // Debounce: several updates can land within milliseconds of each other

    function toggleOnline() {

    // ================== DRIVER VERIFICATION ==================
    function renderDriverVerify() {
        const v = driverState.verify;

        return `
            <div style="padding:80px 16px 16px;min-height:100vh;background:#fff;">

    async function submitDriverVerification() {
        const v = driverState.verify;
        v.err = '';
        const f = v.form;
        const cnic = f.cnic ?? state.profile.cnic;
        const license_number = f.license_number ?? state.profile.license_number;
        const vehicle_type = f.vehicle_type ?? state.profile.vehicle_type ?? 'car';
        const vehicle_plate = f.vehicle_plate ?? state.profile.vehicle_plate;
        if (!cnic || !license_number || !vehicle_plate) { v.err = 'Please fill in CNIC, license number, and vehicle plate.'; render(); return; }

        const hasExistingDocs = state.profile.cnic_photo_url && state.profile.license_photo_url && state.profile.vehicle_photo_url;
        const missingUpload = ['cnic','license','vehicle'].some(k => !v.files[k]);
        if (!hasExistingDocs && missingUpload) { v.err = 'Please upload all three documents.'; render(); return; }

        v.loading = true; render();
        const uid = state.session.user.id;
        const uploadedPaths = {};
        try {
            for (const key of ['cnic','license','vehicle']) {
                const file = v.files[key];
                if (!file) continue; // keep existing doc if not re-uploaded (e.g. resubmission)
                const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
                const path = `${uid}/${key}.${ext}`;
                const { error: upErr } = await sb.storage.from('driver-docs').upload(path, file, { upsert: true });
                if (upErr) throw upErr;
                uploadedPaths[key + '_photo_url'] = path;
            }
        } catch (e) {
            v.loading = false; v.err = e.message || 'File upload failed'; render(); return;
        }

        const { error } = await sb.from('profiles').update({
            cnic, license_number, vehicle_type, vehicle_plate,
            ...uploadedPaths,
            verification_status: 'pending',
            verification_submitted_at: new Date().toISOString(),
            verification_notes: null
        }).eq('id', uid);
        v.loading = false;
        if (error) { v.err = error.message; render(); return; }

        const { data: profile } = await sb.from('profiles').select('*').eq('id', uid).single();
        state.profile = profile;
        driverState.screen = 'dash';
        driverState.verify = { form:{}, files:{}, err:'', loading:false };
        render();
    }
