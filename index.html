        const email = adminState.newAdmin.email;
        if (!email) { alert('Enter an email.'); return; }
        const { error } = await sb.rpc('admin_promote_to_admin', { target_email: email, target_managed_city: null });
        if (error) { alert(error.message); return; }
        adminState.adminMsg = `${email} is now an admin.`;
        adminState.newAdmin = { email: '' };
        await loadAdminData();
    }
    async function demoteUser(userId) {
        if (!confirm('Remove admin access for this user? They will become a regular rider.')) return;
        const { error } = await sb.rpc('admin_demote_admin', { target_user_id: userId, new_role: 'rider' });
        if (error) { alert(error.message); return; }
        adminState.adminMsg = 'Admin access removed.';
        await loadAdminData();
    }

    function renderSosTab() {
        const alerts = adminState.sosAlerts;
        if (alerts.length === 0) {
            return `<div style="background:#f6f6f6;padding:32px;border-radius:8px;text-align:center;color:#757575;">No SOS alerts. That's a good sign.</div>`;
        }
        return alerts.map(a => `
            <div style="border:1px solid ${a.status==='open'?'#f3caca':'#eee'};background:${a.status==='open'?'#fff7f7':'#fff'};padding:18px;border-radius:8px;margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                    <div>
                        <div style="font-weight:700;font-size:15px;">${a.triggered_by_name || 'Unknown'} <span style="font-weight:400;color:#757575;font-size:13px;text-transform:capitalize;">(${a.triggered_by_role})</span></div>
                        <div style="font-size:13px;color:#757575;">${a.triggered_by_phone || 'No phone on file'}</div>
                    </div>
                    <span style="background:${a.status==='open'?'#fdeaea':a.status==='acknowledged'?'#fff6e0':'#e6f6ea'};color:${a.status==='open'?'#c0392b':a.status==='acknowledged'?'#8a6d1a':'#1a8a3d'};padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;text-transform:capitalize;">${a.status}</span>
                </div>
                <div style="font-size:12px;color:#999;margin-bottom:10px;">${new Date(a.created_at).toLocaleString()}${a.lat ? ` · ${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}` : ' · location unavailable'}</div>
                ${a.status !== 'resolved' ? `
                    <div style="display:flex;gap:8px;">
                        ${a.status === 'open' ? `<button onclick="updateSosStatus('${a.id}','acknowledged')" class="uber-btn" style="width:auto;padding:8px 16px;font-size:13px;">Acknowledge</button>` : ''}
                        <button onclick="updateSosStatus('${a.id}','resolved')" class="uber-btn-outline uber-btn" style="width:auto;padding:8px 16px;font-size:13px;">Mark Resolved</button>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    async function updateSosStatus(id, status) {
        const patch = { status };
        if (status === 'resolved') { patch.resolved_at = new Date().toISOString(); patch.resolved_by = state.session.user.id; }
        const { error } = await sb.from('sos_alerts').update(patch).eq('id', id);
        if (error) { alert(error.message); return; }
        loadAdminData();
    }

    function pendingWithdrawalCount(list) { return (list || []).filter(w => w.status === 'pending').length; }
    function renderWithdrawalsTab() {
        const withdrawals = adminState.withdrawals;
        if (withdrawals.length === 0) {
            return `<div style="background:#f6f6f6;padding:32px;border-radius:8px;text-align:center;color:#757575;">No withdrawal requests yet.</div>`;
        }
        return withdrawals.map(w => {
            const driver = adminState.drivers.find(d => d.id === w.driver_id);
            return `
            <div style="border:1px solid ${w.status==='pending'?'#f3e0ab':'#eee'};background:${w.status==='pending'?'#fffaf0':'#fff'};padding:18px;border-radius:8px;margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                    <div>
                        <div style="font-weight:700;font-size:15px;">${driver ? driver.full_name : 'Unknown driver'}</div>
                        <div style="font-size:13px;color:#757575;text-transform:capitalize;">${w.method} · ${w.account_number}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:700;font-size:16px;">Rs ${w.amount}</div>
                        <span style="background:${w.status==='pending'?'#fff6e0':w.status==='paid'?'#e6f6ea':'#fdeaea'};color:${w.status==='pending'?'#8a6d1a':w.status==='paid'?'#1a8a3d':'#c0392b'};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;text-transform:capitalize;">${w.status}</span>
                    </div>
                </div>
                <div style="font-size:12px;color:#999;margin-bottom:10px;">Requested ${new Date(w.requested_at).toLocaleString()}</div>
                ${w.status === 'pending' ? `
                    <div style="display:flex;gap:8px;">
                        <button onclick="updateWithdrawalStatus('${w.id}','paid')" class="uber-btn" style="width:auto;padding:8px 16px;font-size:13px;">Mark Paid</button>
                        <button onclick="updateWithdrawalStatus('${w.id}','rejected')" class="uber-btn-outline uber-btn" style="width:auto;padding:8px 16px;font-size:13px;">Reject</button>
                    </div>
                ` : ''}
            </div>
        `;
        }).join('');
    }
    async function updateWithdrawalStatus(id, status) {
        const patch = { status };
        if (status === 'paid') patch.paid_at = new Date().toISOString();
        const { error } = await sb.from('withdrawal_requests').update(patch).eq('id', id);
        if (error) { alert(error.message); return; }
        loadAdminData();
    }

    function verificationBadge(d) {
        const status = d.verification_status || 'unsubmitted';
        const map = {
            unsubmitted: { label: 'Not submitted', bg: '#f6f6f6', fg: '#757575' },
            pending: { label: 'Pending review', bg: '#fff6e0', fg: '#8a6d1a' },
            auto_flagged: { label: 'Flagged', bg: '#fff0e0', fg: '#a34e00' },
            approved: { label: 'Verified', bg: '#e6f6ea', fg: '#1a8a3d' },
            rejected: { label: 'Rejected', bg: '#fdeaea', fg: '#c0392b' }
        };
        const b = map[status] || map.unsubmitted;
        return `<span style="background:${b.bg};color:${b.fg};padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;">${b.label}</span>`;
    }

    // ================== ADMIN: DRIVER VERIFICATION REVIEW ==================
    async function openDriverReview(driverId) {
        const driver = adminState.drivers.find(d => d.id === driverId);
        if (!driver) return;
        adminState.reviewDriver = driver;
        adminState.reviewDocs = null;
        adminState.reviewNotes = '';
        adminState.reviewErr = '';
        render();

        const docs = {};
        for (const [key, col] of [['cnic','cnic_photo_url'],['license','license_photo_url'],['vehicle','vehicle_photo_url']]) {
            const path = driver[col];
            if (!path) continue;
            const { data, error } = await sb.storage.from('driver-docs').createSignedUrl(path, 3600);
            if (!error && data) docs[key] = data.signedUrl;
        }
        adminState.reviewDocs = docs;
        render();
    }
    function closeDriverReview() {
        adminState.reviewDriver = null; adminState.reviewDocs = null; adminState.reviewNotes = ''; adminState.reviewErr = '';
        render();
    }

    function renderDriverReviewModal() {
        const d = adminState.reviewDriver;
        const docs = adminState.reviewDocs;
        const docLabels = { cnic: 'CNIC Photo', license: 'License Photo', vehicle: 'Vehicle Photo' };
        return `
            <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;" onclick="if(event.target===this)closeDriverReview()">
                <div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <h3 style="font-size:20px;font-weight:700;">${d.full_name}</h3>
                        <button onclick="closeDriverReview()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#757575;">&times;</button>
                    </div>
                    <div style="margin-bottom:16px;">${verificationBadge(d)}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin-bottom:20px;">
                        <div><div style="color:#757575;font-size:12px;">Phone</div>${d.phone || 'N/A'}</div>
                        <div><div style="color:#757575;font-size:12px;">CNIC</div>${d.cnic || 'N/A'}</div>
                        <div><div style="color:#757575;font-size:12px;">License #</div>${d.license_number || 'N/A'}</div>
                        <div><div style="color:#757575;font-size:12px;">Vehicle</div>${(d.vehicle_type||'N/A')} · ${d.vehicle_plate||'N/A'}</div>
                    </div>
                    <div style="font-weight:600;margin-bottom:10px;">Documents</div>
                    ${docs === null ? `<div style="color:#757575;font-size:13px;margin-bottom:16px;">Loading documents...</div>` :
                        Object.keys(docLabels).map(key => `
                            <div style="margin-bottom:14px;">
                                <div style="font-size:13px;color:#757575;margin-bottom:6px;">${docLabels[key]}</div>
                                ${docs[key] ? `<img src="${docs[key]}" style="width:100%;border-radius:8px;border:1px solid #eee;" />` : `<div style="background:#f6f6f6;padding:16px;border-radius:8px;text-align:center;color:#757575;font-size:13px;">Not submitted</div>`}
                            </div>
                        `).join('')
                    }
                    ${d.verification_notes ? `<div style="background:#fdeaea;color:#c0392b;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;">Previous note: ${d.verification_notes}</div>` : ''}
                    ${adminState.reviewErr ? `<div class="err">${adminState.reviewErr}</div>` : ''}
                    <textarea id="review-notes" oninput="adminState.reviewNotes=this.value" placeholder="Rejection reason (required to reject)" style="width:100%;padding:12px;border:1px solid #eee;border-radius:8px;margin:8px 0 16px;font-size:14px;resize:none;min-height:60px;font-family:inherit;">${adminState.reviewNotes}</textarea>
                    <div style="display:flex;gap:10px;">
                        <button onclick="approveDriver('${d.id}')" class="uber-btn" ${adminState.reviewLoading?'disabled':''}>Approve</button>
                        <button onclick="rejectDriver('${d.id}')" class="uber-btn-outline uber-btn" ${adminState.reviewLoading?'disabled':''}>Reject</button>
                    </div>
                </div>
            </div>
        `;
    }

    async function approveDriver(driverId) {
        adminState.reviewErr = ''; adminState.reviewLoading = true; render();
        const { error } = await sb.from('profiles').update({
            is_verified: true, verification_status: 'approved', verification_reviewed_at: new Date().toISOString(), verification_notes: null
        }).eq('id', driverId);
        adminState.reviewLoading = false;
        if (error) { adminState.reviewErr = error.message; render(); return; }
        closeDriverReview();
        loadAdminData();
    }
    async function rejectDriver(driverId) {
        if (!adminState.reviewNotes.trim()) { adminState.reviewErr = 'Please provide a reason for rejection.'; render(); return; }
        adminState.reviewErr = ''; adminState.reviewLoading = true; render();
        const { error } = await sb.from('profiles').update({
            is_verified: false, verification_status: 'rejected', verification_reviewed_at: new Date().toISOString(), verification_notes: adminState.reviewNotes.trim()
        }).eq('id', driverId);
        adminState.reviewLoading = false;
        if (error) { adminState.reviewErr = error.message; render(); return; }
        closeDriverReview();
        loadAdminData();
    }

    async function submitAdminSignup() {
        adminState.err = '';
        const f = adminState.form;
        if (!f.name || !f.email || !f.password || !f.accessCode) { adminState.err = 'All fields required, including the access code'; render(); return; }
        const { data, error } = await sb.auth.signUp({
            email: f.email, password: f.password,
            options: { data: { full_name: f.name, role: 'rider' } } // starts as rider; promoted below if code is valid
        });
        if (error) { adminState.err = error.message; render(); return; }
        if (!data.session) { adminState.err = 'Check your email to confirm your account, then log in as admin.'; adminState.authMode = 'login'; render(); return; }
        const { data: claimed, error: claimErr } = await sb.rpc('claim_admin', { access_code: f.accessCode });
        if (claimErr || !claimed) {
            adminState.err = 'Invalid access code. Account created as a regular rider instead.';
            await sb.auth.signOut();
            render(); return;
        }
        const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
        state.session = data.session; state.profile = profile;
        loadAdminData();
    }

    async function submitAdminLogin() {
        adminState.err = '';
        const f = adminState.form;
        if (!f.email || !f.password) { adminState.err = 'Email and password required'; render(); return; }
        const { data, error } = await sb.auth.signInWithPassword({ email: f.email, password: f.password });
        if (error) { adminState.err = error.message; render(); return; }
        const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
        if (profile?.role !== 'admin') {
            adminState.err = 'This account does not have admin access.';
            await sb.auth.signOut(); render(); return;
        }
        state.session = data.session; state.profile = profile;
        loadAdminData();
    }

    async function loadAdminData() {
        const [{ data: rides }, { data: profiles }, { data: cities }, { data: sosAlerts }, { data: withdrawals }, { data: users }, { data: fareSettings }, { data: content }] = await Promise.all([
            sb.from('rides').select('*').order('created_at', { ascending: false }),
            sb.from('profiles').select('*'),
            sb.from('cities').select('*').order('name'),
            sb.from('sos_alerts').select('*').order('created_at', { ascending: false }),
            sb.from('withdrawal_requests').select('*').order('requested_at', { ascending: false }),
            sb.rpc('admin_list_users'),
            sb.from('fare_settings').select('*').order('vehicle_type'),
            sb.from('app_content').select('*')
        ]);
        adminState.rides = rides || [];
        adminState.drivers = profiles || [];
        adminState.cities = cities || [];
        adminState.sosAlerts = sosAlerts || [];
        adminState.withdrawals = withdrawals || [];
        adminState.users = users || [];
        adminState.fareSettings = fareSettings || [];
        adminState.content = Object.fromEntries((content || []).map(c => [c.key, c.content]));
        if (!adminState.sosChannel) {
            adminState.sosChannel = sb.channel('admin-sos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'sos_alerts' }, () => {
                    sb.from('sos_alerts').select('*').order('created_at', { ascending: false }).then(({ data }) => {
                        adminState.sosAlerts = data || [];
                        render();
                    });
                })
                .subscribe();
        }
        render();
    }

    // ================== INIT ==================
    (async function init() {
        sb.from('fare_settings').select('*').then(({ data }) => { state.fareSettings = data || []; render(); });
        sb.from('app_content').select('*').then(({ data }) => { state.appContent = Object.fromEntries((data||[]).map(c=>[c.key,c.content])); render(); });
        sb.from('cities').select('*').then(({ data }) => { state.cities = data || []; render(); });
        await refreshSession();
        render();
    })();
    </script>
</body>
</html>
